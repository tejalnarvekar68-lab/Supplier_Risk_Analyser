#Defines how multiple services, such as FastAPI and PostgreSQL, work together.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supplier_risk
      POSTGRES_USER: supplier_app
      #POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U supplier_app -d supplier_risk"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      #DATABASE_URL: postgresql+psycopg://supplier_app:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/supplier_risk
      DATABASE_URL: postgresql+psycopg://supplier_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/supplier_risk
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  dashboard:
    build: .
    command: ["streamlit","run","dashboard/app.py","--server.address=0.0.0.0","--server.port=8501"]
    environment:
      API_URL: http://api:8000
      APP_API_KEY: ${APP_API_KEY}
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
volumes:
  pgdata:
